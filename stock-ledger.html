  renderAllocChart(holdings.map(enrichHolding));
  renderDivChart();
  renderTrendChart();
  renderTaxSummary();
}
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if(currentPage === 'analysis') renderAnalysis(); }, 150);
});

// ── 自動抓現價 ────────────────────────────────────────
// 台股：台北時間 13:30 前用「前一交易日收盤價」，13:30 後用「當天收盤價」。
// 美股：用最新一筆收盤價。
// 資料來源：
//   1. 證交所 MIS 即時報價（有當天收盤）— 沒開放跨網域，需透過公開 CORS 轉接站，可能不穩
//   2. FinMind 日收盤（可直接連線，較穩；但當天收盤要到盤後較晚才會有）
// 同時最多 4 個請求並行；抓不到的股票保留原本的價格，沒有價格時顯示「尚無現價」。
const CORS_PROXIES = [
  u => 'https://api.cors.lol/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
];
const TW_CUTOFF_MINUTES = 13 * 60 + 30;
const RETRY_MS = 10 * 60 * 1000;
const FETCH_CONCURRENCY = 4;

function taipeiNow(){
  const d = new Date(Date.now() + 8 * 3600 * 1000);
  return { date: d.toISOString().slice(0, 10), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
}

async function fetchJson(url, timeoutMs = 8000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }finally{ clearTimeout(timer); }
}

async function fetchJsonViaProxy(url){
  let lastErr;
  for(const wrap of CORS_PROXIES){
    try{
      let data = await fetchJson(wrap(url));
      if(data && typeof data.contents === 'string') data = JSON.parse(data.contents);
      return data;
    }catch(err){ lastErr = err; }
  }
  throw lastErr || new Error('fetch failed');
}

async function mapLimit(list, n, fn){
  const out = [];
  let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, list.length) }, async () => {
    while(i < list.length){ const k = i++; out[k] = await fn(list[k]).catch(() => null); }
  }));
  return out;
}

// 回傳 { code: { price, isToday, label } }；拿不到的代號不會出現在結果裡
async function fetchTwPricesFromMis(codes){
  const exCh = codes.flatMap(c => ['tse_' + c + '.tw', 'otc_' + c + '.tw']).join('|');
  const data = await fetchJsonViaProxy('https://mis.twse.com.tw/stock/api/getStockInfo.jsp?json=1&delay=0&ex_ch=' + exCh);
  const now = taipeiNow();
  const today = now.date.replace(/-/g, '');
  const out = {};
  const num = v => { const n = parseFloat(v); return isNaN(n) || n <= 0 ? null : n; };
  for(const m of (data && data.msgArray) || []){
    const last = num(m.z) ?? num(m.pz);
    const prevClose = num(m.y);
    const quoteDate = m.d ? `${m.d.slice(4, 6)}/${m.d.slice(6, 8)}` : '';
    let price, isToday = false, label;
    if(m.d === today && now.minutes < TW_CUTOFF_MINUTES){
      price = prevClose; label = '前一交易日收盤';                     // 盤前/盤中：用昨收
    }else if(m.d === today){
      price = last ?? prevClose; isToday = last != null;                // 13:30 後：當天收盤
      label = last != null ? quoteDate + ' 收盤' : '前一交易日收盤';
    }else{
      price = last ?? prevClose; label = quoteDate + ' 收盤';           // 非交易日：最近一個交易日的收盤
      isToday = now.minutes >= TW_CUTOFF_MINUTES;
    }
    if(price != null) out[m.c] = { price, isToday, label };
  }
  return out;
}

async function fetchFinMindBars(dataset, code){
  const start = new Date(Date.now() - 30 * 86400 * 1000).toISOString().slice(0, 10);
  const data = await fetchJson('https://api.finmindtrade.com/api/v4/data?dataset=' + dataset + '&data_id=' + encodeURIComponent(code) + '&start_date=' + start);
  return ((data && data.data) || [])
    .map(r => ({ date: r.date, close: r.close ?? r.Close }))
    .filter(r => r.close != null && r.close > 0)
    .sort((x, y) => x.date < y.date ? -1 : 1);
}

async function fetchTwPriceFromFinMind(code){
  const bars = await fetchFinMindBars('TaiwanStockPrice', code);
  const now = taipeiNow();
  const usable = now.minutes >= TW_CUTOFF_MINUTES ? bars : bars.filter(b => b.date < now.date);
  const bar = usable[usable.length - 1];
  if(!bar) return null;
  // 13:30 後但 FinMind 還沒有今天的資料，就先用最近收盤，之後再重試
  return { price: bar.close, isToday: bar.date === now.date || now.minutes < TW_CUTOFF_MINUTES, label: mmdd(bar.date) + ' 收盤' };
}

async function fetchUsPrice(code){
  const bars = await fetchFinMindBars('USStockPrice', code);
  const bar = bars[bars.length - 1];
  return bar ? { price: bar.close, isToday: true, label: mmdd(bar.date) + ' 收盤（美東）' } : null;
}

let refreshingPrices = false;
let refreshAgain = false;
let retryTimer = null;
// only：只更新這些代號（例如剛新增交易的那一檔）；不給就更新全部持股
async function refreshPrices(only){
  if(refreshingPrices){ refreshAgain = true; return; }
  const statusEl = $('priceStatus');
  const btn = $('refreshPricesBtn');
  const markets = {};
  for(const h of computeHoldings().holdings) markets[h.symbol] = h.market;
  let syms = Object.keys(markets);
  if(Array.isArray(only)) syms = syms.filter(s => only.includes(s));
  if(!syms.length){ if(!only) statusEl.textContent = ''; return; }

  refreshingPrices = true;
  btn.disabled = true;
  statusEl.textContent = `更新中…（${syms.length} 檔）`;
  const failed = [];
  let waitingForClose = false;
  const twSyms = syms.filter(s => markets[s] !== '美股');
  const misPromise = twSyms.length ? fetchTwPricesFromMis(twSyms).catch(() => ({})) : Promise.resolve({});

  await mapLimit(syms, FETCH_CONCURRENCY, async sym => {
    const market = markets[sym];
    let r = null;
    if(market === '美股'){
      r = await fetchUsPrice(sym).catch(() => null);
    } else {
      r = (await misPromise)[sym] || await fetchTwPriceFromFinMind(sym).catch(() => null);
      if(r && !r.isToday) waitingForClose = true;
    }
    if(!r){ failed.push(sym); return; }
    state.prices[sym] = { price: roundTo(r.price, PRICE_DECIMALS[market]), source: 'auto', label: r.label, at: Date.now() };
  });

  save();
  renderAll();
  const t = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  let msg = `${t} 已更新 ${syms.length - failed.length} 檔`;
  if(waitingForClose) msg += '（今日收盤價尚未取得，暫用前一交易日收盤）';
  if(failed.length){
    const noPrice = failed.filter(s => priceOf(s) == null);
    msg += `，${failed.join('、')} 抓不到`;
    msg += noPrice.length ? '（顯示「尚無現價」，可手動輸入）' : '（沿用上次的價格）';
  }
  statusEl.textContent = msg;
  btn.disabled = false;
  refreshingPrices = false;

  if(!only){
    clearTimeout(retryTimer);
    if(waitingForClose && taipeiNow().minutes < 18 * 60) retryTimer = setTimeout(refreshPrices, RETRY_MS);
  }
  if(refreshAgain){ refreshAgain = false; refreshPrices(); }
}
$('refreshPricesBtn').addEventListener('click', () => refreshPrices());

// 頁面開著跨過 13:30 時，自動再抓一次當天收盤價
function scheduleCloseRefresh(){
  const mins = TW_CUTOFF_MINUTES + 1 - taipeiNow().minutes;
  if(mins > 0) setTimeout(refreshPrices, mins * 60 * 1000);
}

// ── 股票代號清單（自動帶名稱＋防呆） ─────────────────
// 從 FinMind 下載台股（上市/上櫃/興櫃）與美股代號清單，快取在瀏覽器 7 天。
// 清單還沒載入前，先用上面內建的常見代號對照表。
const DIR_KEY = 'stock-ledger-dir-v1';
const DIR_MAX_AGE = 7 * 86400 * 1000;
const stockDir = { '台股': { ...STOCK_NAMES }, '美股': { ...US_STOCK_NAMES } };
const dirReady = { '台股': false, '美股': false };

function normalizeSymbol(v){
  return String(v || '').trim().toUpperCase().replace(/[-/]/g, '.');
}

function cleanUsName(name){
  return String(name || '').replace(/\s+(Common Stock|Ordinary Shares|American Depositary Shares|Class [A-Z] (Common|Ordinary)).*$/i, '').trim();
}

function applyDirectory(tw, us){
  if(tw && Object.keys(tw).length){ Object.assign(stockDir['台股'], tw); dirReady['台股'] = true; }
  if(us && Object.keys(us).length){
    for(const [code, name] of Object.entries(us)) if(!US_STOCK_NAMES[code]) stockDir['美股'][code] = name;
    dirReady['美股'] = true;
  }
}

async function downloadDirectory(dataset){
  const data = await fetchJson('https://api.finmindtrade.com/api/v4/data?dataset=' + dataset, 60000);
  const rows = ((data && data.data) || []).slice().sort((a, b) => String(a.date || '') < String(b.date || '') ? -1 : 1);
  const map = {};
  for(const r of rows){
    const code = normalizeSymbol(r.stock_id);
    if(!code || !r.stock_name) continue;
    map[code] = dataset === 'USStockInfo' ? cleanUsName(r.stock_name) : String(r.stock_name).trim();
  }
  return map;
}

async function loadStockDirectory(){
  let cache = null;
  try{ cache = JSON.parse(localStorage.getItem(DIR_KEY) || 'null'); }catch(e){ cache = null; }
  if(cache) applyDirectory(cache.tw, cache.us);
  if(!(cache && Date.now() - cache.ts < DIR_MAX_AGE && cache.tw && cache.us)){
    const [tw, us] = await Promise.all([
      downloadDirectory('TaiwanStockInfo').catch(() => null),
      downloadDirectory('USStockInfo').catch(() => null),
    ]);
    applyDirectory(tw, us);
    if(tw && us && Object.keys(tw).length && Object.keys(us).length){
      try{ localStorage.setItem(DIR_KEY, JSON.stringify({ ts: Date.now(), tw, us })); }catch(e){}
    }
  }
  // 清單載入後，重新檢查表單上已輸入的代號（編輯中就不動，避免蓋掉自動欄位）
  if($('fSymbol').value) fillStockName($('fSymbol'), $('fName'), $('fSymbolHint'), $('fMarket').value);
  if($('dSymbol').value) fillStockName($('dSymbol'), $('dName'), $('dSymbolHint'), divMarketFor($('dSymbol').value));
}

function otherMarket(market){ return market === '美股' ? '台股' : '美股'; }

// 檢查代號是否存在於該市場；回傳 { name } 或 { error }
function checkStock(market, code){
  code = normalizeSymbol(code);
  const name = stockDir[market][code];
  if(name) return { name };
  const other = otherMarket(market);
  if(stockDir[other][code]){
    return { error: `「${code} ${stockDir[other][code]}」是${other}，請把市場切換成${other}` };
  }
  if(!dirReady[market]) return { error: `${market}代號清單尚未載入，無法確認「${code}」，請確認網路後重新整理頁面` };
  return { error: `查無${market}代號「${code}」` };
}

// 配息沒有市場選項：有交易紀錄就用交易的市場，否則依代號清單判斷
function divMarketFor(symbol){
  const code = normalizeSymbol(symbol);
  const tx = state.tx.find(t => normalizeSymbol(t.symbol) === code);
  if(tx) return mktOf(tx);
  if(stockDir['台股'][code]) return '台股';
  if(stockDir['美股'][code]) return '美股';
  return /^[0-9]/.test(code) ? '台股' : '美股';
}

// 使用者直接輸入完整名稱（如「台積電」）時，換成代號
function resolveSymbolInput(input, market){
  const text = input.value.trim();
  if(!text || stockDir[market][normalizeSymbol(text)]) return;
  for(const m of [market, otherMarket(market)]){
    const hit = Object.entries(stockDir[m]).find(([, n]) => n === text || n.toUpperCase() === text.toUpperCase());
    if(hit){ input.value = hit[0]; return; }
  }
}

function fillStockName(input, nameEl, hintEl, market){
  const code = normalizeSymbol(input.value);
  if(!code){ nameEl.value = ''; hintEl.textContent = ''; hintEl.style.color = ''; return; }
  const r = checkStock(market, code);
  nameEl.value = r.name || '';
  hintEl.textContent = r.error || '';
  hintEl.style.color = r.error ? 'var(--danger)' : '';
}

// 下拉建議：代號開頭符合或名稱包含輸入文字，最多 20 筆
function updateSymbolSuggestions(input, listEl, market){
  const q = input.value.trim().toUpperCase();
  if(!q){ listEl.innerHTML = ''; return; }
  const markets = market ? [market] : ['台股', '美股'];
  const hits = [];
  for(const m of markets){
    for(const [code, name] of Object.entries(stockDir[m])){
      if(code.startsWith(q) || name.toUpperCase().includes(q)) hits.push([code, name, m]);
      if(hits.length >= 200) break;
    }
  }
  hits.sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || a[0].length - b[0].length || (a[0] < b[0] ? -1 : 1));
  listEl.innerHTML = hits.slice(0, 20).map(([code, name, m]) =>
    `<option value="${escapeHtml(code)}">${escapeHtml(name)}${market ? '' : '（' + m + '）'}</option>`).join('');
}

// 代號輸入時，依所選市場的股票清單自動帶入名稱；名稱欄位不開放手動輸入
// （放在其他 input 監聽器之前註冊，讓名稱換成代號後才計算手續費與股數）
$('fSymbol').addEventListener('input', function(){
  resolveSymbolInput(this, $('fMarket').value);
  fillStockName(this, $('fName'), $('fSymbolHint'), $('fMarket').value);
  updateSymbolSuggestions(this, $('fSymbolList'), $('fMarket').value);
}, { capture: true });
$('dSymbol').addEventListener('input', function(){
  resolveSymbolInput(this, divMarketFor(this.value));
  fillStockName(this, $('dName'), $('dSymbolHint'), divMarketFor(this.value));
  updateSymbolSuggestions(this, $('dSymbolList'), null);
}, { capture: true });

// ── 啟動 ──────────────────────────────────────────────
load();
$('fDate').value = todayLocal();
$('dDate').value = todayLocal();
updateTxFormForMarket();
updateDivFieldLabels();
recalcFeeTax();
recalcDivTax();
loadFeeSettingsIntoForm();
loadExchangeRateIntoForm();
renderAll();
{
  let saved = null;
  try{ saved = localStorage.getItem(PAGE_KEY); }catch(e){}
  showPage(document.querySelector(`.page[data-page="${saved}"]`) ? saved : 'overview');
}
refreshPrices();
scheduleCloseRefresh();
loadStockDirectory();
</script>

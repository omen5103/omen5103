<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F1720; --surface:#172532; --surface2:#1E3040; --line:#2A3D4D;
  --text:#E7EDF3; --text2:#8AA0B2; --text3:#5C7186;
  --gain:#4FA894; --gain-bg:#173A34; --loss:#C4634F; --loss-bg:#3A2019;
  --gold:#E8B44C; --gold-bg:#3A2E12; --violet:#8B85D6; --violet-bg:#241F44;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#F4F2ED; --surface:#FFFFFF; --surface2:#EFEBE3; --line:#DAD4C6;
    --text:#20241F; --text2:#5B6459; --text3:#8C9488;
    --gain:#2F7A67; --gain-bg:#E1F0EA; --loss:#A3402C; --loss-bg:#F5E2DC;
    --gold:#9A6B14; --gold-bg:#F3E7C9; --violet:#5A50A8; --violet-bg:#E8E5F7;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1720; --surface:#172532; --surface2:#1E3040; --line:#2A3D4D;
  --text:#E7EDF3; --text2:#8AA0B2; --text3:#5C7186;
  --gain:#4FA894; --gain-bg:#173A34; --loss:#C4634F; --loss-bg:#3A2019;
  --gold:#E8B44C; --gold-bg:#3A2E12; --violet:#8B85D6; --violet-bg:#241F44;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,sans-serif;padding:20px 16px 60px;min-height:100vh;}
.wrap{max-width:640px;margin:0 auto;}
.page-tabs{position:sticky;top:0;z-index:10;display:flex;gap:4px;background:var(--bg);padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--line);}
.page-tabs button{flex:1 1 0;min-width:0;background:none;border:1px solid transparent;border-radius:8px;padding:9px 2px;font-size:13px;color:var(--text2);cursor:pointer;font-family:inherit;white-space:nowrap;}
.page-tabs button.active{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);font-weight:600;}
.page:not(.active){display:none;}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
h1{font-size:20px;font-weight:600;margin:0 0 4px;letter-spacing:.2px;}
.sub{color:var(--text2);font-size:13px;margin:0 0 16px;}

.acct-filter{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.acct-filter label{font-size:12px;color:var(--text2);white-space:nowrap;width:64px;flex:0 0 64px;}
.acct-filter select{width:auto;flex:1;}

.export-row{margin-bottom:20px;}
.export-btn{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.export-btn:hover{border-color:var(--gold);color:var(--gold);}
.export-status{display:block;text-align:center;font-size:12px;color:var(--text3);margin-top:6px;min-height:14px;}

.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.summary2{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:20px;}
.summary .cell,.summary2 .cell{background:var(--surface);padding:14px 12px;}
.summary .label,.summary2 .label{font-size:11px;color:var(--text3);margin-bottom:6px;}
.summary .value,.summary2 .value{font-size:17px;font-weight:600;}
.summary .value.gain,.summary2 .value.gain{color:var(--gain);}
.summary .value.loss,.summary2 .value.loss{color:var(--loss);}
.summary2 .value.div{color:var(--violet);}

.section-title{font-size:13px;color:var(--text2);margin:24px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line);}
.market-heading{font-size:12px;color:var(--text2);font-weight:600;margin:0 0 6px;}
.market-block{margin-bottom:20px;}

.holdings{display:flex;flex-direction:column;gap:8px;margin-bottom:8px;}
.holding{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;}
.holding-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.holding-name{font-weight:600;font-size:14px;}
.holding-sym{color:var(--text3);font-size:12px;margin-left:6px;}
.acct-tag{display:inline-block;font-size:10px;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
.holding-pl{font-size:14px;font-weight:600;}
.holding-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:12px;color:var(--text2);}
.holding-grid div span{display:block;color:var(--text);font-size:13px;margin-top:2px;}
.holding-div{font-size:12px;color:var(--text2);margin-top:8px;}
.holding-div span{color:var(--violet);font-weight:600;}
.holding-div.stock span{color:var(--gold);}
.price-edit{display:flex;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
.price-edit label{font-size:12px;color:var(--text2);white-space:nowrap;}
.price-edit input{width:100%;}
.quote-link{font-size:12px;color:var(--gold);text-decoration:none;white-space:nowrap;border:1px solid var(--gold);border-radius:6px;padding:8px 10px;}
.quote-link:hover{background:var(--gold-bg);}
.empty{color:var(--text3);font-size:13px;padding:20px 0;text-align:center;}

form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;}
.form-row.hidden{display:none;}
.form-row{display:flex;gap:8px;margin-bottom:8px;}
.form-row:last-child{margin-bottom:0;}
input,select{background:var(--surface2);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font-size:16px;font-family:inherit;width:100%;}
input.mono,select.mono{font-family:'IBM Plex Mono',monospace;}
input:focus,select:focus{outline:none;border-color:var(--gold);}
.field-label{font-size:11px;color:var(--text3);margin-bottom:4px;display:block;}
.field{flex:1;min-width:0;}
.action-toggle{display:flex;gap:4px;}
.action-toggle button{flex:1 1 50%;background:var(--surface2);border:1px solid var(--line);border-radius:8px;color:var(--text2);padding:12px 24px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:background .1s,border-color .1s,color .1s;}
.action-toggle button.active[data-a="buy"]{background:var(--gain-bg);color:var(--gain);border-color:var(--gain);}
.action-toggle button.active[data-a="sell"]{background:var(--loss-bg);color:var(--loss);border-color:var(--loss);}
.action-toggle button.active[data-dt="cash"]{background:var(--violet-bg);color:var(--violet);border-color:var(--violet);}
.action-toggle button.active[data-dt="stock"]{background:var(--gold-bg);color:var(--gold);border-color:var(--gold);}
.submit-btn{width:100%;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:2px;}
.submit-btn.div-btn{background:var(--violet-bg);color:var(--violet);border-color:var(--violet);}
.submit-btn:active{opacity:.8;}
.error{color:var(--loss);font-size:12px;margin-top:4px;display:none;}
.hint{color:var(--text3);font-size:12px;margin-top:6px;}
input[readonly]{opacity:.75;cursor:default;}

.log{display:flex;flex-direction:column;}
.log-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line);scrollbar-width:thin;}
.log-tab{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--text2);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.log-tab .mono{font-weight:600;}
.log-tab .cnt{color:var(--text3);margin-left:4px;}
.log-tab.active{background:var(--gold-bg);border-color:var(--gold);color:var(--gold);}
.log-tab.active .cnt{color:var(--gold);}
.log-row{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13px;}
.log-row:last-child{border-bottom:none;}
.log-tag{font-size:11px;padding:2px 6px;border-radius:4px;font-weight:600;min-width:32px;text-align:center;}
.log-tag.buy{background:var(--gain-bg);color:var(--gain);}
.log-tag.sell{background:var(--loss-bg);color:var(--loss);}
.log-tag.dividend{background:var(--violet-bg);color:var(--violet);}
.log-tag.stockdiv{background:var(--gold-bg);color:var(--gold);}
.log-main{flex:1;}
.log-sym{font-weight:600;}
.log-detail{color:var(--text3);font-size:12px;}
.log-fees{color:var(--text3);font-size:11px;}
.log-date{color:var(--text3);font-size:12px;white-space:nowrap;}
.log-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0 4px;line-height:1;}
.log-del:hover{color:var(--loss);}
.log-edit{background:none;border:none;color:var(--text3);cursor:pointer;font-size:14px;padding:0 4px;line-height:1;}
.log-edit:hover{color:var(--gold);}
.log-actions{display:flex;gap:2px;}
.cancel-btn{width:100%;background:none;color:var(--text2);border:1px solid var(--line);border-radius:6px;padding:9px;font-size:13px;cursor:pointer;font-family:inherit;margin-top:6px;display:none;}
.editing{border-color:var(--gold);}
.new-acct-row{display:none;}
.new-acct-row.show{display:flex;}
.add-acct-btn{flex:0 0 auto;width:auto;background:var(--gold-bg);color:var(--gold);border:1px solid var(--gold);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;}
.settings-toggle{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;color:var(--text2);padding:10px;font-size:13px;cursor:pointer;font-family:inherit;margin-bottom:8px;}
.settings-toggle:hover{border-color:var(--gold);color:var(--gold);}
.fee-settings{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:8px;}
.fee-settings.show{display:block;}
</style>
</head>
<body>
<div class="wrap">
  <h1>股票紀錄</h1>
  <p class="sub">記錄買賣與配息、追蹤庫存與總報酬，資料存在這個瀏覽器裡</p>

  <nav class="page-tabs" id="pageTabs">
    <button type="button" data-page="overview" class="active">總覽</button>
    <button type="button" data-page="forms">新增</button>
    <button type="button" data-page="holdings">庫存</button>
    <button type="button" data-page="log">紀錄</button>
    <button type="button" data-page="backup">匯出備份</button>
  </nav>

  <section class="page" data-page="overview">
  <div class="acct-filter">
    <label>市場</label>
    <select id="marketFilter" class="mono">
      <option value="__all__">全部市場</option>
      <option value="台股">台股</option>
      <option value="美股">美股</option>
    </select>
  </div>

  <div class="acct-filter">
    <label>證券戶</label>
    <select id="acctFilter" class="mono"><option value="__all__">全部帳戶</option></select>
  </div>

  <div class="acct-filter">
    <label>庫存檢視</label>
    <select id="viewMode" class="mono">
      <option value="account">依證券戶分開</option>
      <option value="symbol">依股票代碼合併</option>
    </select>
  </div>

  <div id="summaryContainer"></div>

  </section>

  <section class="page" data-page="forms">
  <div class="section-title">新增交易</div>
  <button type="button" id="feeSettingsToggle" class="settings-toggle" onclick="toggleFeeSettings()">⚙ 手續費／證交稅設定</button>
  <div class="fee-settings" id="feeSettingsPanel">
    <div class="form-row">
      <select id="feeSettingsAccount" class="mono" onchange="loadFeeSettingsIntoForm()">
        <option value="__default__">預設值（未特別設定的證券戶適用）</option>
      </select>
    </div>
    <div class="form-row">
      <div class="field">
        <label class="field-label">手續費率(%)</label>
        <input class="mono" id="setFeeRate" type="number" min="0" step="0.0001">
      </div>
      <div class="field">
        <label class="field-label">手續費折扣(%)</label>
        <input class="mono" id="setFeeDiscount" type="number" min="0" step="1">
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label class="field-label">手續費最低金額</label>
        <input class="mono" id="setFeeMin" type="number" min="0" step="1">
      </div>
      <div class="field">
        <label class="field-label">證交稅率(%)（僅賣出）</label>
        <input class="mono" id="setTaxRate" type="number" min="0" step="0.01">
      </div>
    </div>
    <div class="hint">股票證交稅一般是 0.3%，若是 ETF 通常是 0.1%，可自行調整；算出的金額僅供參考，仍可在下方手動修改。每個證券戶可以分開設定，沒有另外設定過的證券戶會套用「預設值」。</div>
    <button type="button" class="submit-btn" onclick="saveFeeSettings()">儲存這個證券戶的設定</button>
  </div>
  <form id="txForm">
    <div class="form-row">
      <div class="action-toggle">
        <button type="button" data-a="buy" class="active">買進</button>
        <button type="button" data-a="sell">賣出</button>
      </div>
    </div>
    <div class="form-row">
      <select id="fMarket" class="mono">
        <option value="台股">台股</option>
        <option value="美股">美股</option>
      </select>
    </div>
    <div class="form-row">
      <select id="fAccount" class="mono"><option value="">選擇證券戶</option></select>
    </div>
    <div class="form-row new-acct-row" id="fNewAcctRow">
      <input id="fNewAcctInput" placeholder="輸入新證券戶名稱" maxlength="20">
      <button type="button" class="add-acct-btn" onclick="confirmNewAccount('f')">新增</button>
    </div>
    <div class="form-row">
      <input class="mono" id="fSymbol" placeholder="代號或名稱" maxlength="20" list="fSymbolList" autocomplete="off">
      <input id="fName" placeholder="名稱（自動帶入）" readonly tabindex="-1">
    </div>
    <div class="hint" id="fSymbolHint"></div>
    <div class="form-row">
      <input class="mono" id="fShares" placeholder="股數" type="number" min="0" step="1">
      <input class="mono" id="fPrice" placeholder="價格" type="number" min="0" step="0.01">
    </div>
    <div class="form-row hidden" id="fTwdCostRow">
      <input class="mono" id="fTwdCost" placeholder="台幣成本（選填，實際換匯花費的台幣）" type="number" min="0" step="1">
    </div>
    <div class="form-row">
      <div class="field">
        <label class="field-label">手續費（自動）</label>
        <input class="mono" id="fFee" placeholder="0" type="number" min="0" step="0.01">
      </div>
      <div class="field">
        <label class="field-label">證交稅（自動）</label>
        <input class="mono" id="fTax" placeholder="0" type="number" min="0" step="0.01">
      </div>
    </div>
    <div class="form-row">
      <input class="mono" id="fDate" type="date">
    </div>
    <div class="error" id="fError"></div>
    <button type="submit" class="submit-btn" id="fSubmitBtn">新增交易</button>
    <button type="button" class="cancel-btn" id="txCancelBtn" onclick="cancelTxEdit()">取消編輯</button>
  </form>

  <div class="section-title">新增配息</div>
  <form id="divForm">
    <div class="form-row">
      <div class="action-toggle">
        <button type="button" data-dt="cash" class="active">現金股利</button>
        <button type="button" data-dt="stock">股票股利</button>
      </div>
    </div>
    <div class="form-row">
      <select id="dAccount" class="mono"><option value="">選擇證券戶</option></select>
    </div>
    <div class="form-row new-acct-row" id="dNewAcctRow">
      <input id="dNewAcctInput" placeholder="輸入新證券戶名稱" maxlength="20">
      <button type="button" class="add-acct-btn" onclick="confirmNewAccount('d')">新增</button>
    </div>
    <div class="form-row">
      <input class="mono" id="dSymbol" placeholder="代號或名稱" maxlength="20" list="dSymbolList" autocomplete="off">
      <input id="dName" placeholder="名稱（自動帶入）" readonly tabindex="-1">
    </div>
    <div class="hint" id="dSymbolHint"></div>
    <div class="form-row">
      <input class="mono" id="dPerShare" placeholder="每股配息" type="number" min="0" step="0.0001">
      <input class="mono" id="dShares" placeholder="股數（預設為目前庫存）" type="number" min="0" step="1">
    </div>
    <div class="form-row" id="dRemitFeeRow">
      <input class="mono" id="dRemitFee" placeholder="匯費（海外股利常見，無則留空）" type="number" min="0" step="0.01">
    </div>
    <div class="form-row">
      <input class="mono" id="dDate" type="date">
    </div>
    <div class="hint" id="dHint"></div>
    <div class="error" id="dError"></div>
    <button type="submit" class="submit-btn div-btn" id="dSubmitBtn">新增配息紀錄</button>
    <button type="button" class="cancel-btn" id="divCancelBtn" onclick="cancelDivEdit()">取消編輯</button>
  </form>
  <datalist id="acctList"></datalist>
  <datalist id="fSymbolList"></datalist>
  <datalist id="dSymbolList"></datalist>
  </section>

  <section class="page" data-page="holdings">
  <div class="section-title">庫存</div>
  <div class="acct-filter">
    <label>美元匯率</label>
    <input class="mono" id="exchangeRateInput" type="number" min="0" step="0.01">
    <button type="button" class="add-acct-btn" onclick="saveExchangeRate()">儲存</button>
    <span id="rateStatus" style="font-size:12px;color:var(--text2);"></span>
  </div>

  <div class="acct-filter">
    <label>現價</label>
    <button type="button" class="add-acct-btn" id="refreshPricesBtn" onclick="refreshPrices()">更新現價與匯率</button>
    <span id="priceStatus" style="font-size:12px;color:var(--text2);"></span>
  </div>

  <div class="holdings" id="holdings"></div>
  </section>

  <section class="page" data-page="log">
  <div class="section-title">交易與配息紀錄</div>
  <div class="log" id="log"></div>
  </section>

  <section class="page" data-page="backup">
  <div class="section-title">匯出</div>
  <div class="export-row">
    <button type="button" id="exportBtn" class="export-btn" onclick="exportExcel()">匯出 Excel</button>
    <span class="export-status" id="exportStatus"></span>
  </div>

  <div class="section-title">資料備份</div>
  <div class="export-row" style="margin-bottom:8px;">
    <button type="button" id="backupBtn" class="export-btn" onclick="exportBackup()">匯出備份（JSON，可用來還原）</button>
    <span class="export-status" id="backupStatus"></span>
  </div>

  <div class="export-row">
    <label for="restoreFile" class="export-btn" style="display:block;text-align:center;cursor:pointer;">匯入備份還原資料</label>
    <input type="file" id="restoreFile" accept="application/json" style="display:none;">
    <span class="export-status" id="restoreStatus"></span>
    <button type="button" id="restoreConfirmBtn" class="cancel-btn" style="margin-top:8px;" onclick="confirmRestore()">確認匯入（會覆蓋目前資料）</button>
  </div>
  </section>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// 常見台股代號對照表（非完整清單，找不到時可自行輸入名稱）
const STOCK_NAMES = {
  '2330':'台積電','2317':'鴻海','2454':'聯發科','2412':'中華電','1301':'台塑',
  '1303':'南亞','1326':'台化','2308':'台達電','2881':'富邦金','2882':'國泰金',
  '2891':'中信金','2886':'兆豐金','2884':'玉山金','2885':'元大金','2892':'第一金',
  '5880':'合庫金','2880':'華南金','2887':'台新金','2890':'永豐金','2883':'開發金',
  '3008':'大立光','2303':'聯電','2002':'中鋼','1101':'台泥','1102':'亞泥',
  '2603':'長榮','2609':'陽明','2615':'萬海','2382':'廣達','2357':'華碩',

const STORE_KEY = 'stock-ledger-v4';
const OLD_KEYS = ['stock-ledger-v3','stock-ledger-v2'];
const DEFAULT_ACCT = '未分類';
const PRESET_ACCOUNTS = ['國泰','永豐','台新','玉山'];
const DEFAULT_FEE_SETTINGS = { feeRate: 0.1425, feeDiscount: 100, feeMin: 20, taxRate: 0.3 };
const DEFAULT_EXCHANGE_RATE = 31.5;
let state = { tx: [], prices: {}, dividends: [], customAccounts: [], feeSettingsByAccount: { '__default__': {...DEFAULT_FEE_SETTINGS} }, exchangeRate: DEFAULT_EXCHANGE_RATE };
let acctFilter = '__all__';
let marketFilter = '__all__';
let viewMode = 'account';

function getMarketForSymbol(symbol){
  const sorted = [...state.tx].filter(t=>t.symbol===symbol).sort((a,b)=> new Date(b.date)-new Date(a.date) || b.id-a.id);
  return sorted.length ? (sorted[0].market || '台股') : '台股';
}

function load(){
  try{
    let raw = localStorage.getItem(STORE_KEY);
    if(!raw){
      for(const k of OLD_KEYS){ raw = localStorage.getItem(k); if(raw) break; }
    }
    if(raw) state = Object.assign({tx:[],prices:{},dividends:[],customAccounts:[],feeSettingsByAccount:{},exchangeRate:DEFAULT_EXCHANGE_RATE}, JSON.parse(raw));
    if(!state.customAccounts) state.customAccounts = [];
    if(!state.exchangeRate || state.exchangeRate <= 0) state.exchangeRate = DEFAULT_EXCHANGE_RATE;
    // Migrate the old single global feeSettings (pre-per-account version) into the default slot.
    if(state.feeSettings && (!state.feeSettingsByAccount || Object.keys(state.feeSettingsByAccount).length === 0)){
      state.feeSettingsByAccount = { '__default__': state.feeSettings };
    }
    if(!state.feeSettingsByAccount) state.feeSettingsByAccount = {};
    if(!state.feeSettingsByAccount['__default__']) state.feeSettingsByAccount['__default__'] = {...DEFAULT_FEE_SETTINGS};
    state.tx = state.tx.map(t => ({ fee:0, tax:0, account: DEFAULT_ACCT, market: '台股', twdCost: 0, ...t }));
    state.dividends = state.dividends.map(d => ({ account: DEFAULT_ACCT, type: 'cash', remitFee: 0, market: d.market || getMarketForSymbol(d.symbol), ...d }));
  }catch(e){ console.warn('load failed', e); }
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  catch(e){ console.warn('save failed', e); }
}

function fmt(n){
  n = Number(n)||0;
  return n.toLocaleString('zh-Hant', {maximumFractionDigits:2});
}
function money(n, market){
  const v = Number(n)||0;
  const sign = v < 0 ? '-' : '';
  const symbol = market === '美股' ? 'US$' : 'NT$';
  return sign + symbol + fmt(Math.abs(v));
}
function quoteUrl(symbol, market){
  if(market === '美股'){
    return 'https://www.google.com/search?q=' + encodeURIComponent(symbol + ' stock price');
  }
  return 'https://www.google.com/finance/quote/' + encodeURIComponent(symbol) + ':TPE';
}

function allAccounts(){
  const set = new Set();
  state.tx.forEach(t => set.add(t.account || DEFAULT_ACCT));
  state.dividends.forEach(d => set.add(d.account || DEFAULT_ACCT));
  return [...set].sort();
}

function matchesAcct(item){
  return acctFilter === '__all__' || (item.account||DEFAULT_ACCT) === acctFilter;
}
function matchesMarket(item){
  return marketFilter === '__all__' || (item.market||'台股') === marketFilter;
}
function filteredTx(){
  return state.tx.filter(t => matchesAcct(t) && matchesMarket(t));
}
function filteredDividends(){
  return state.dividends.filter(d => matchesAcct(d) && matchesMarket(d));
}
function filteredCashDividends(){
  return filteredDividends().filter(d => (d.type||'cash') === 'cash');
}
function filteredStockDividends(){
  return filteredDividends().filter(d => d.type === 'stock');
}

// Groups by symbol + account so the same stock in different brokerages stays separate.
// Merges buy/sell transactions with stock-dividend events (which add shares at no cost).
// Returns { holdings: [...], realizedPL: {台股:number, 美股:number} }
function computeHoldings(){
  const byKey = {};
  const realizedPL = { '台股': 0, '美股': 0 };
  const txEvents = filteredTx().map(t=>({...t, kind:'tx'}));
  const stockDivEvents = filteredStockDividends().map(d=>({...d, kind:'stockdiv'}));
  const events = [...txEvents, ...stockDivEvents].sort((a,b)=> new Date(a.date) - new Date(b.date) || a.id - b.id);
  for(const e of events){
    const account = e.account || DEFAULT_ACCT;
    const market = e.market || '台股';
    const key = e.symbol + '::' + account;
    if(!byKey[key]) byKey[key] = { symbol:e.symbol, name:e.name, account, market, shares:0, cost:0, twdCost:0 };
    const h = byKey[key];
    h.name = e.name || h.name;
    if(e.kind === 'tx'){
      h.market = e.market || h.market;
      const fee = Number(e.fee)||0;
      const tax = Number(e.tax)||0;
      if(e.action === 'buy'){
        h.cost += e.shares * e.price + fee + tax;
        h.twdCost += Number(e.twdCost)||0;
        h.shares += e.shares;
      } else {
        const avgCost = h.shares > 0 ? h.cost / h.shares : 0;
        const avgTwdCost = h.shares > 0 ? h.twdCost / h.shares : 0;
        const netProceeds = e.shares * e.price - fee - tax;
        const costRemoved = avgCost * e.shares;
        realizedPL[market] = (realizedPL[market]||0) + (netProceeds - costRemoved);
        h.shares -= e.shares;
        h.cost -= costRemoved;
        h.twdCost -= avgTwdCost * e.shares;
        if(h.shares <= 0.0001){ h.shares = 0; h.cost = 0; h.twdCost = 0; }
      }
    } else {
      // Stock dividend: adds shares with no cost change, so average cost drops naturally.
      const ratio = Number(e.perShare)||0;
      const baseShares = Number(e.shares)||0;
      h.shares += baseShares * ratio;
    }
  }
  return { holdings: Object.values(byKey).filter(h => h.shares > 0.0001), realizedPL };
}

function computeDividendsByKey(){
  const byKey = {};
  for(const d of filteredCashDividends()){
    const account = d.account || DEFAULT_ACCT;
    const key = d.symbol + '::' + account;
    if(!byKey[key]) byKey[key] = 0;
    byKey[key] += d.shares * d.perShare - (Number(d.remitFee)||0);
  }
  return byKey;
}

function computeStockDivSharesByKey(){
  const byKey = {};
  for(const d of filteredStockDividends()){
    const account = d.account || DEFAULT_ACCT;
    const key = d.symbol + '::' + account;
    if(!byKey[key]) byKey[key] = 0;
    byKey[key] += (Number(d.shares)||0) * (Number(d.perShare)||0);
  }
  return byKey;
}

function totalDividendsByMarket(){
  const totals = { '台股': 0, '美股': 0 };
  for(const d of filteredCashDividends()){
    const market = d.market || '台股';
    totals[market] = (totals[market]||0) + d.shares * d.perShare - (Number(d.remitFee)||0);
  }
  return totals;
}

function renderSummary(holdings, realizedPL){
  const byMarket = { '台股': [], '美股': [] };
  for(const h of holdings){
    byMarket[h.market || '台股'].push(h);
  }
  const divByMarket = totalDividendsByMarket();
  const markets = ['台股','美股'].filter(m => byMarket[m].length > 0 || (realizedPL[m]||0) !== 0 || (divByMarket[m]||0) !== 0);
  const activeMarkets = markets.length ? markets : ['台股'];

  const el = document.getElementById('summaryContainer');
  el.innerHTML = activeMarkets.map(market=>{
    let totalCost = 0, totalValue = 0, totalNetValue = 0;
    for(const h of byMarket[market]){
      const price = state.prices[h.symbol] ?? (h.shares>0 ? h.cost/h.shares : 0);
      const value = price * h.shares;
      const s = getFeeSettings(h.account);
      const netValue = value - calcFee(value, s) - calcTax(value, 'sell', s);
      totalCost += h.cost;
      totalValue += value;
      totalNetValue += netValue;
    }
    const pl = totalNetValue - totalCost;
    const realized = realizedPL[market] || 0;
    const div = divByMarket[market] || 0;
    const totalReturn = pl + realized + div;
    const heading = activeMarkets.length > 1 ? `<div class="market-heading">${market}</div>` : '';
    return `
      <div class="market-block">
        ${heading}
        <div class="summary">
          <div class="cell"><div class="label">總成本</div><div class="value mono">${money(totalCost, market)}</div></div>
          <div class="cell"><div class="label">目前市值</div><div class="value mono">${money(totalValue, market)}</div></div>
          <div class="cell"><div class="label">未實現損益*</div><div class="value mono ${pl>0?'gain':pl<0?'loss':''}">${pl>=0?'+':''}${money(pl, market)}</div></div>
        </div>
        <div class="hint" style="margin:6px 0 12px;">*已扣除依目前設定試算的賣出手續費與證交稅</div>
        <div class="summary2">
          <div class="cell"><div class="label">已實現損益</div><div class="value mono ${realized>0?'gain':realized<0?'loss':''}">${realized>=0?'+':''}${money(realized, market)}</div></div>
          <div class="cell"><div class="label">已領股利</div><div class="value mono div">${money(div, market)}</div></div>
          <div class="cell"><div class="label">總報酬</div><div class="value mono ${totalReturn>0?'gain':totalReturn<0?'loss':''}">${totalReturn>=0?'+':''}${money(totalReturn, market)}</div></div>
        </div>
      </div>`;
  }).join('');
}

function renderTwdLine(h){
  const twdValue = h.value * state.exchangeRate;
  if(h.twdCost > 0){
    const twdPl = twdValue - h.twdCost;
    const twdPlClass = twdPl>0?'gain':twdPl<0?'loss':'';
    return `<div class="holding-div">台幣現值 <span class="mono">${money(twdValue,'台股')}</span>，台幣成本 <span class="mono">${money(h.twdCost,'台股')}</span>，台幣損益 <span class="mono ${twdPlClass}">${twdPl>=0?'+':''}${money(twdPl,'台股')}</span>（匯率 ${state.exchangeRate}）</div>`;
  }
  return `<div class="holding-div">台幣現值 <span class="mono">${money(twdValue,'台股')}</span>（匯率 ${state.exchangeRate}，未記錄台幣成本）</div>`;
}

function renderHoldings(holdings){
  const el = document.getElementById('holdings');
  const divByKey = computeDividendsByKey();
  const stockDivByKey = computeStockDivSharesByKey();
  if(holdings.length === 0){
    el.innerHTML = '<div class="empty">還沒有庫存，新增第一筆交易吧</div>';
    return;
  }
  const showAcctTag = acctFilter === '__all__';

  // Compute each per-account holding's figures first (fees depend on that account's own settings).
  const enriched = holdings.map(h=>{
    const key = h.symbol + '::' + h.account;
    const avgCost = h.shares>0 ? h.cost/h.shares : 0;
    const price = state.prices[h.symbol] ?? avgCost;
    const value = price * h.shares;
    const s = getFeeSettings(h.account);
    const sellFee = calcFee(value, s);
    const sellTax = calcTax(value, 'sell', s);
    const netValue = value - sellFee - sellTax;
    return {
      symbol: h.symbol, name: h.name, market: h.market || '台股', accounts: [h.account],
      shares: h.shares, cost: h.cost, twdCost: h.twdCost||0, value, sellFee, sellTax, netValue,
      divTotal: divByKey[key] || 0, stockDivShares: stockDivByKey[key] || 0
    };
  });

  let rows;
  if(viewMode === 'symbol'){
    const bySymbol = {};
    for(const h of enriched){
      if(!bySymbol[h.symbol]){
        bySymbol[h.symbol] = { symbol:h.symbol, name:h.name, market:h.market, accounts:[], shares:0, cost:0, twdCost:0, value:0, sellFee:0, sellTax:0, netValue:0, divTotal:0, stockDivShares:0 };
      }
      const agg = bySymbol[h.symbol];
      agg.name = h.name || agg.name;
      agg.accounts.push(...h.accounts);
      agg.shares += h.shares;
      agg.cost += h.cost;
      agg.twdCost += h.twdCost;
      agg.value += h.value;
      agg.sellFee += h.sellFee;
      agg.sellTax += h.sellTax;
      agg.netValue += h.netValue;
      agg.divTotal += h.divTotal;
      agg.stockDivShares += h.stockDivShares;
    }
    rows = Object.values(bySymbol);
  } else {
    rows = enriched;
  }

  el.innerHTML = rows.map(h=>{
    const avgCost = h.shares>0 ? h.cost/h.shares : 0;
    const price = state.prices[h.symbol] ?? avgCost;
    const pl = h.netValue - h.cost;
    const plPct = h.cost>0 ? (pl/h.cost*100) : 0;
    const plClass = pl>0?'gain':pl<0?'loss':'';
    let tagHtml = '';
    if(viewMode === 'symbol'){
      tagHtml = h.accounts.length > 1
        ? `<span class="acct-tag">${h.accounts.length} 個帳戶</span>`
        : (showAcctTag ? `<span class="acct-tag">${escapeHtml(h.accounts[0])}</span>` : '');
    } else if(showAcctTag){
      tagHtml = `<span class="acct-tag">${escapeHtml(h.accounts[0])}</span>`;
    }
    return `
      <div class="holding">
        <div class="holding-top">
          <div><span class="holding-name">${escapeHtml(h.name||h.symbol)}</span><span class="holding-sym">${escapeHtml(h.symbol)}</span>${tagHtml}</div>
          <div class="holding-pl mono ${plClass}">${pl>=0?'+':''}${money(pl, h.market)} (${plPct>=0?'+':''}${plPct.toFixed(1)}%)</div>
        </div>
        <div class="holding-grid mono">
          <div>股數<span>${fmt(h.shares)}</span></div>
          <div>均價<span>${money(avgCost, h.market)}</span></div>
          <div>成本<span>${money(h.cost, h.market)}</span></div>
          <div>市值<span>${money(h.value, h.market)}</span></div>
        </div>
        <div class="holding-div">預估賣出成本 <span class="mono">${money(h.sellFee + h.sellTax, h.market)}</span>（手續費 ${money(h.sellFee, h.market)}＋證交稅 ${money(h.sellTax, h.market)}）</div>
        ${h.market === '美股' ? renderTwdLine(h) : ''}
        ${h.divTotal>0 ? `<div class="holding-div">累計配息 <span class="mono">${money(h.divTotal, h.market)}</span></div>` : ''}
        ${h.stockDivShares>0 ? `<div class="holding-div stock">累計股票股利 <span class="mono">${fmt(h.stockDivShares)} 股</span></div>` : ''}
        <div class="price-edit">
          <label>現價</label>
          <input class="mono" type="number" step="0.01" min="0" value="${price?Number(price).toFixed(2):''}" data-symbol="${escapeHtml(h.symbol)}" onchange="updatePrice(this)">
          <a class="quote-link" href="${quoteUrl(h.symbol, h.market)}" target="_blank" rel="noopener">查即時報價 ↗</a>
        </div>
      </div>`;
  }).join('');
}

function renderLog(){
  const el = document.getElementById('log');

  const items = [
    ...filteredTx().map(t=>({...t, kind:'tx'})),
    ...filteredDividends().map(d=>({...d, kind:'div'}))

  if(items.length === 0){
    el.innerHTML = '<div class="empty">尚無紀錄</div>';
    return;
  }

  // 依股票代號分頁（Tab）；「全部」放在最前面
  const groups = {};
  for(const t of items){
    const code = normalizeSymbol(t.symbol);
    if(!groups[code]) groups[code] = { code, name: t.name || '', count: 0 };
    groups[code].count++;
    if(!groups[code].name && t.name) groups[code].name = t.name;
  }
  const codes = Object.keys(groups).sort();
  if(logTab !== '__all__' && !groups[logTab]) logTab = '__all__';
  const tabBtn = (key, label, count) =>
    `<button type="button" class="log-tab${logTab === key ? ' active' : ''}" onclick="selectLogTab('${escapeHtml(key)}')">${label}<span class="cnt">${count}</span></button>`;
  const tabsHtml = '<div class="log-tabs">' +
    tabBtn('__all__', '全部', items.length) +
    codes.map(c => tabBtn(c, `<span class="mono">${escapeHtml(c)}</span> ${escapeHtml(groups[c].name)}`, groups[c].count)).join('') +
    '</div>';

  const shown = logTab === '__all__' ? items : items.filter(t => normalizeSymbol(t.symbol) === logTab);
  const sorted = shown.sort((a,b)=> new Date(b.date) - new Date(a.date) || b.id - a.id);
  el.innerHTML = tabsHtml + sorted.map(t=>{
    const acctBadge = showAcctTag ? `<span class="acct-tag">${escapeHtml(t.account||DEFAULT_ACCT)}</span>` : '';
    if(t.kind === 'tx'){
      const fee = Number(t.fee)||0;
      const tax = Number(t.tax)||0;
      let feesLine = '';
      if(fee>0 || tax>0){
        const parts = [];
        if(fee>0) parts.push('手續費 ' + money(fee, t.market));
        if(tax>0) parts.push('證交稅 ' + money(tax, t.market));
        feesLine = `<div class="log-fees mono">${parts.join('，')}</div>`;
      }
      return `
      <div class="log-row">
        <div class="log-tag ${t.action}">${t.action==='buy'?'買':'賣'}</div>
        <div class="log-main">
          <span class="log-sym">${escapeHtml(t.name||t.symbol)}</span>${acctBadge}
          <div class="log-detail mono">${fmt(t.shares)} 股 @ ${money(t.price, t.market)}</div>
          ${feesLine}
        </div>
        <div class="log-date mono">${t.date}</div>
        <div class="log-actions">
          <button class="log-edit" onclick="editTx(${t.id})" aria-label="編輯">✎</button>
          <button class="log-del" onclick="deleteTx(${t.id})" aria-label="刪除">×</button>
        </div>
      </div>`;
    } else {
      const isStock = t.type === 'stock';
      const amount = t.shares * t.perShare;
      const remitFee = Number(t.remitFee)||0;
      const netAmount = amount - remitFee;
      const detail = isStock
        ? `${fmt(t.shares)} 股 x ${fmt(t.perShare)} = 取得 ${fmt(amount)} 股`
        : `${fmt(t.shares)} 股 x ${money(t.perShare, t.market)} = ${money(amount, t.market)}`;
      const remitLine = (!isStock && remitFee>0)
        ? `<div class="log-fees mono">匯費 ${money(remitFee, t.market)}，實收 ${money(netAmount, t.market)}</div>`
        : '';
      return `
      <div class="log-row">
        <div class="log-tag ${isStock?'stockdiv':'dividend'}">${isStock?'股':'息'}</div>
        <div class="log-main">
          <span class="log-sym">${escapeHtml(t.name||t.symbol)}</span>${acctBadge}
          <div class="log-detail mono">${detail}</div>
          ${remitLine}
        </div>
        <div class="log-date mono">${t.date}</div>
        <div class="log-actions">
          <button class="log-edit" onclick="editDiv(${t.id})" aria-label="編輯">✎</button>
          <button class="log-del" onclick="deleteDiv(${t.id})" aria-label="刪除">×</button>
        </div>
      </div>`;
    }
  }).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function currentSharesFor(symbol, account){
  const savedFilter = acctFilter;
  const savedMarket = marketFilter;
  acctFilter = account ? account : '__all__';
  marketFilter = '__all__';
  const { holdings } = computeHoldings();
  acctFilter = savedFilter;
  marketFilter = savedMarket;
  if(account){
    const h = holdings.find(x=>x.symbol === symbol && x.account === account);
    return h ? h.shares : 0;
  }
  return holdings.filter(x=>x.symbol===symbol).reduce((s,h)=>s+h.shares,0);
}

let currentAction = 'buy';
let lastAutoFee = null;
let lastAutoTax = null;

function getFeeSettings(account){
  return state.feeSettingsByAccount[account] || state.feeSettingsByAccount['__default__'] || {...DEFAULT_FEE_SETTINGS};
}
function calcFee(amount, s){
  let fee = amount * (s.feeRate/100) * (s.feeDiscount/100);
  if(fee < s.feeMin) fee = s.feeMin;
  return Math.round(fee);
}
function calcTax(amount, action, s){
  if(action !== 'sell') return 0;
  return Math.round(amount * (s.taxRate/100));
}
function recalcFeeTax(){
  const shares = parseFloat(document.getElementById('fShares').value);
  const price = parseFloat(document.getElementById('fPrice').value);
  if(!shares || shares <= 0 || isNaN(price) || price < 0) return;
  const amount = shares * price;
  const acctValue = document.getElementById('fAccount').value;
  const account = (acctValue && acctValue !== '__new__') ? acctValue : DEFAULT_ACCT;
  const s = getFeeSettings(account);
  const fee = calcFee(amount, s);
  const tax = calcTax(amount, currentAction, s);
  const feeInput = document.getElementById('fFee');
  const taxInput = document.getElementById('fTax');
  if(feeInput.value === '' || feeInput.value === String(lastAutoFee)){
    feeInput.value = fee;
    lastAutoFee = fee;
  }
  if(taxInput.value === '' || taxInput.value === String(lastAutoTax)){
    taxInput.value = tax;
    lastAutoTax = tax;
  }
}

async function exportBackup(){
  const statusEl = document.getElementById('backupStatus');
  statusEl.textContent = '';
  if(!window.claude || !window.claude.use){
    statusEl.textContent = '這個環境不支援匯出，請在 Claude 內開啟此頁面';
    return;
  }
  let downloads;
  try{ downloads = await window.claude.use('downloads'); }catch(e){ downloads = null; }
  if(!downloads){
    statusEl.textContent = '目前無法使用匯出功能';
    return;
  }
  statusEl.textContent = '匯出中…';
  try{
    const json = JSON.stringify(state, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const today = new Date().toISOString().slice(0,10);
    await downloads.save({ filename: `股票紀錄備份_${today}.json`, data: blob });
    statusEl.textContent = '已匯出，請妥善保存這個檔案';
    setTimeout(()=>{ if(statusEl.textContent.startsWith('已匯出')) statusEl.textContent = ''; }, 4000);
  }catch(err){
    if(err && err.code === 'declined'){
      statusEl.textContent = '';
    } else {
      statusEl.textContent = '匯出失敗，請稍後再試';
    }
  }
}
window.exportBackup = exportBackup;

    try{
      const parsed = JSON.parse(evt.target.result);
      if(!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.tx)){
        statusEl.textContent = '這個檔案看起來不是有效的備份檔';
        return;
      }
      pendingRestoreData = parsed;
      const txCount = parsed.tx.length;
      const divCount = Array.isArray(parsed.dividends) ? parsed.dividends.length : 0;
      statusEl.textContent = `讀到 ${txCount} 筆交易、${divCount} 筆配息，確認後會覆蓋目前畫面上的資料`;
      confirmBtn.style.display = 'block';
    }catch(err){
      statusEl.textContent = '檔案讀取失敗，請確認是這個工具匯出的備份檔';
    }
  };
  reader.onerror = function(){
    statusEl.textContent = '檔案讀取失敗';
  };
  reader.readAsText(file);
});

function confirmRestore(){
  const statusEl = document.getElementById('restoreStatus');
  if(!pendingRestoreData){
    statusEl.textContent = '請先選擇備份檔案';
    return;
  }
  state = Object.assign(
    { tx:[], prices:{}, dividends:[], customAccounts:[], feeSettingsByAccount:{ '__default__': {...DEFAULT_FEE_SETTINGS} }, exchangeRate: DEFAULT_EXCHANGE_RATE },
    pendingRestoreData
  );
  if(!state.customAccounts) state.customAccounts = [];
  if(!state.exchangeRate || state.exchangeRate <= 0) state.exchangeRate = DEFAULT_EXCHANGE_RATE;
  if(!state.feeSettingsByAccount) state.feeSettingsByAccount = {};
  if(!state.feeSettingsByAccount['__default__']) state.feeSettingsByAccount['__default__'] = {...DEFAULT_FEE_SETTINGS};
  state.tx = state.tx.map(t => ({ fee:0, tax:0, account: DEFAULT_ACCT, market: '台股', twdCost: 0, ...t }));
  state.dividends = (state.dividends||[]).map(d => ({ account: DEFAULT_ACCT, type: 'cash', remitFee: 0, market: d.market || getMarketForSymbol(d.symbol), ...d }));
  save();
  pendingRestoreData = null;
  document.getElementById('restoreFile').value = '';
  document.getElementById('restoreConfirmBtn').style.display = 'none';
  statusEl.textContent = '已還原完成';
  setTimeout(()=>{ if(statusEl.textContent === '已還原完成') statusEl.textContent = ''; }, 4000);
  loadFeeSettingsIntoForm();
  loadExchangeRateIntoForm();
  renderAll();
}
window.confirmRestore = confirmRestore;

async function exportExcel(){
  const statusEl = document.getElementById('exportStatus');
  statusEl.textContent = '';

  if(!window.claude || !window.claude.use){
    statusEl.textContent = '這個環境不支援匯出，請在 Claude 內開啟此頁面';
    return;
  }
  if(typeof XLSX === 'undefined'){
    statusEl.textContent = '匯出元件載入失敗，請重新整理再試一次';
    return;
  }

  let downloads;
  try{
    downloads = await window.claude.use('downloads');
  }catch(e){ downloads = null; }
  if(!downloads){
    statusEl.textContent = '目前無法使用匯出功能';
    return;
  }

  statusEl.textContent = '匯出中…';

  // Export always covers every account and market, regardless of the current filter.
  const savedFilter = acctFilter;
  const savedMarket = marketFilter;
  acctFilter = '__all__';
  marketFilter = '__all__';
  const { holdings } = computeHoldings();
  const divByKey = computeDividendsByKey();
  const stockDivByKey = computeStockDivSharesByKey();
  acctFilter = savedFilter;
  marketFilter = savedMarket;

  const wb = XLSX.utils.book_new();

  const txRows = [...state.tx]
    .sort((a,b)=> new Date(a.date) - new Date(b.date) || a.id - b.id)
    .map(t=>{
      const fee = Number(t.fee)||0, tax = Number(t.tax)||0;
      const netAmount = t.action === 'buy'
        ? t.shares * t.price + fee + tax
        : t.shares * t.price - fee - tax;
      return {
        '日期': t.date,
        '證券戶': t.account || DEFAULT_ACCT,
        '市場': t.market || '台股',
        '代號': t.symbol,
        '名稱': t.name || '',
        '買賣': t.action === 'buy' ? '買進' : '賣出',
        '股數': t.shares,
        '價格': t.price,
        '手續費': fee,
        '證交稅': tax,
        '淨額': netAmount,
        '台幣成本': (t.market === '美股') ? (Number(t.twdCost)||0) : ''
      };
    });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(txRows), '交易紀錄');

  const divRows = [...state.dividends]
    .sort((a,b)=> new Date(a.date) - new Date(b.date) || a.id - b.id)
    .map(d=>{
      const isStock = d.type === 'stock';
      const remitFee = Number(d.remitFee)||0;
      const amount = d.shares * d.perShare;
      const row = {
        '日期': d.date,
        '證券戶': d.account || DEFAULT_ACCT,
        '市場': d.market || '台股',
        '代號': d.symbol,
        '名稱': d.name || '',
        '類型': isStock ? '股票股利' : '現金股利',
        '股數': d.shares,
        [isStock ? '每股配股比例' : '每股配息']: d.perShare
      };
      row[isStock ? '取得股數' : '配息金額'] = amount;
      if(!isStock){
        row['匯費'] = remitFee;
        row['實收金額'] = amount - remitFee;
      }
      return row;
    });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(divRows), '配息紀錄');

  const holdingRows = holdings.map(h=>{
    const key = h.symbol + '::' + h.account;
    const avgCost = h.shares > 0 ? h.cost / h.shares : 0;
    const price = state.prices[h.symbol] ?? avgCost;
    const value = price * h.shares;
    const isUS = (h.market||'台股') === '美股';
    const row = {
      '證券戶': h.account,
      '市場': h.market || '台股',
      '代號': h.symbol,
      '名稱': h.name || '',
      '股數': h.shares,
      '均價': avgCost,
      '成本': h.cost,
      '現價': price,
      '市值': value,
      '未實現損益': value - h.cost,
      '累計配息': divByKey[key] || 0,
      '累計股票股利股數': stockDivByKey[key] || 0
    };
    if(isUS){
      row['台幣成本'] = h.twdCost || 0;
      row['台幣現值（依目前匯率）'] = value * state.exchangeRate;
      row['使用匯率'] = state.exchangeRate;
    }
    return row;
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(holdingRows), '庫存');

  try{
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    const today = new Date().toISOString().slice(0,10);
    await downloads.save({ filename: `股票紀錄_${today}.xlsx`, data: wbout });
    statusEl.textContent = '已匯出';
    setTimeout(()=>{ if(statusEl.textContent === '已匯出') statusEl.textContent = ''; }, 3000);
  }catch(err){
    if(err && err.code === 'declined'){
      statusEl.textContent = '';
    } else {
      statusEl.textContent = '匯出失敗，請稍後再試';
    }
  }
}
window.exportExcel = exportExcel;


// ── 自動抓現價 ──────────────────────────────────────────
// 台股：台北時間 13:30 前用「前一交易日收盤價」，13:30 後用「當天收盤價」。
// 美股：用最新一筆收盤價。
// 資料來源：
//   1. 證交所 MIS 即時報價（有當天收盤）— 沒開放跨網域，需透過公開 CORS 轉接站，可能不穩
//   2. FinMind 日收盤（可直接連線，較穩；但當天收盤要到盤後較晚才會有）
const CORS_PROXIES = [
  u => 'https://api.cors.lol/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/get?url=' + encodeURIComponent(u),
];
const TW_CUTOFF_MINUTES = 13 * 60 + 30;
const RETRY_MS = 10 * 60 * 1000;

function taipeiNow(){
  const d = new Date(Date.now() + 8 * 3600 * 1000);
  return { date: d.toISOString().slice(0,10), minutes: d.getUTCHours() * 60 + d.getUTCMinutes() };
}

async function fetchJson(url, timeoutMs = 8000){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try{
    const res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  }finally{ clearTimeout(timer); }
}

async function fetchJsonViaProxy(url){
  let lastErr;
  for(const wrap of CORS_PROXIES){
    try{
      let data = await fetchJson(wrap(url));
      if(data && typeof data.contents === 'string') data = JSON.parse(data.contents);
      return data;
    }catch(err){ lastErr = err; }
  }
  throw lastErr || new Error('fetch failed');
}

// 回傳 { code: { price, isToday } }；拿不到的代號不會出現在結果裡
async function fetchTwPricesFromMis(codes){
  const exCh = codes.flatMap(c => ['tse_' + c + '.tw', 'otc_' + c + '.tw']).join('|');
  const data = await fetchJsonViaProxy('https://mis.twse.com.tw/stock/api/getStockInfo.jsp?json=1&delay=0&ex_ch=' + exCh);
  const now = taipeiNow();
  const today = now.date.replace(/-/g, '');
  const out = {};
  for(const m of (data && data.msgArray) || []){
    const num = v => { const n = parseFloat(v); return isNaN(n) || n <= 0 ? null : n; };
    const last = num(m.z) ?? num(m.pz);
    const prevClose = num(m.y);
    let price, isToday = false;
    if(m.d === today && now.minutes < TW_CUTOFF_MINUTES){
      price = prevClose;                      // 盤前/盤中：用昨收
    }else if(m.d === today){
      price = last ?? prevClose; isToday = last != null;  // 13:30 後：當天收盤
    }else{
      price = last ?? prevClose;              // 非交易日：最近一個交易日的收盤
      isToday = now.minutes >= TW_CUTOFF_MINUTES;
    }
    if(price != null) out[m.c] = { price, isToday };
  }
  return out;
}

async function fetchFinMindBars(dataset, code){
  const start = new Date(Date.now() - 14 * 86400 * 1000).toISOString().slice(0,10);
  const data = await fetchJson('https://api.finmindtrade.com/api/v4/data?dataset=' + dataset + '&data_id=' + encodeURIComponent(code) + '&start_date=' + start);
  return ((data && data.data) || [])
    .map(r => ({ date: r.date, close: r.close ?? r.Close }))
    .filter(r => r.close != null && r.close > 0)
    .sort((x, y) => x.date < y.date ? -1 : 1);
}

async function fetchTwPriceFromFinMind(code){
  const bars = await fetchFinMindBars('TaiwanStockPrice', code);
  const now = taipeiNow();
  const usable = now.minutes >= TW_CUTOFF_MINUTES ? bars : bars.filter(b => b.date < now.date);
  const bar = usable[usable.length - 1];
  if(!bar) return null;
  // 13:30 後但 FinMind 還沒有今天的資料，就先用最近收盤，之後再重試
  return { price: bar.close, isToday: bar.date === now.date || now.minutes < TW_CUTOFF_MINUTES };
}

async function fetchUsPrice(code){
  const bars = await fetchFinMindBars('USStockPrice', code);
  const bar = bars[bars.length - 1];
  return bar ? bar.close : null;
}

// ── 股票代號清單（自動帶名稱＋防呆） ─────────────────────
// 從 FinMind 下載台股（上市/上櫃/興櫃）與美股代號清單，快取在瀏覽器 7 天。
// 清單還沒載入前，先用上面內建的常見代號對照表。
const DIR_KEY = 'stock-ledger-dir-v1';
const DIR_MAX_AGE = 7 * 86400 * 1000;
const stockDir = { '台股': { ...STOCK_NAMES }, '美股': { ...US_STOCK_NAMES } };
const dirReady = { '台股': false, '美股': false };

function normalizeSymbol(v){
  return String(v || '').trim().toUpperCase().replace(/[-/]/g, '.');
}

function cleanUsName(name){
  return String(name || '').replace(/\s+(Common Stock|Ordinary Shares|American Depositary Shares|Class [A-Z] (Common|Ordinary)).*$/i, '').trim();
}

function applyDirectory(tw, us){
  if(tw && Object.keys(tw).length){ Object.assign(stockDir['台股'], tw); dirReady['台股'] = true; }
  if(us && Object.keys(us).length){
    for(const [code, name] of Object.entries(us)) if(!US_STOCK_NAMES[code]) stockDir['美股'][code] = name;
    dirReady['美股'] = true;
  }
}

async function downloadDirectory(dataset){
  const data = await fetchJson('https://api.finmindtrade.com/api/v4/data?dataset=' + dataset, 60000);
  const rows = ((data && data.data) || []).slice().sort((a, b) => String(a.date || '') < String(b.date || '') ? -1 : 1);
  const map = {};
  for(const r of rows){
    const code = normalizeSymbol(r.stock_id);
    if(!code || !r.stock_name) continue;
    map[code] = dataset === 'USStockInfo' ? cleanUsName(r.stock_name) : String(r.stock_name).trim();
  }
  return map;
}

async function loadStockDirectory(){
  let cache = null;
  try{ cache = JSON.parse(localStorage.getItem(DIR_KEY) || 'null'); }catch(e){ cache = null; }
  if(cache) applyDirectory(cache.tw, cache.us);
  if(!(cache && Date.now() - cache.ts < DIR_MAX_AGE && cache.tw && cache.us)){
    const [tw, us] = await Promise.all([
      downloadDirectory('TaiwanStockInfo').catch(() => null),
      downloadDirectory('USStockInfo').catch(() => null),
    ]);
    applyDirectory(tw, us);
    if(tw && us && Object.keys(tw).length && Object.keys(us).length){
      try{ localStorage.setItem(DIR_KEY, JSON.stringify({ ts: Date.now(), tw, us })); }catch(e){}
    }
  }
  // 清單載入後，重新檢查表單上已輸入的代號
  document.getElementById('fSymbol').dispatchEvent(new Event('input'));
  document.getElementById('dSymbol').dispatchEvent(new Event('input'));
}

function otherMarket(market){ return market === '美股' ? '台股' : '美股'; }

// 檢查代號是否存在於該市場；回傳 { name } 或 { error }
function checkStock(market, code){
  code = normalizeSymbol(code);
  const name = stockDir[market][code];
  if(name) return { name };
  const other = otherMarket(market);
  if(stockDir[other][code]){
    return { error: `「${code} ${stockDir[other][code]}」是${other}，請把市場切換成${other}` };
  }
  if(!dirReady[market]) return { error: `${market}代號清單尚未載入，無法確認「${code}」，請確認網路後重新整理頁面` };
  return { error: `查無${market}代號「${code}」` };
}

// 配息沒有市場選項：有交易紀錄就用交易的市場，否則依代號清單判斷
function divMarketFor(symbol){
  const code = normalizeSymbol(symbol);
  const tx = state.tx.find(t => normalizeSymbol(t.symbol) === code);
  if(tx) return tx.market || '台股';
  if(stockDir['台股'][code]) return '台股';
  if(stockDir['美股'][code]) return '美股';
  return /^[0-9]/.test(code) ? '台股' : '美股';
}

// 使用者直接輸入完整名稱（如「台積電」）時，換成代號
function resolveSymbolInput(input, market){
  const text = input.value.trim();
  if(!text || stockDir[market][normalizeSymbol(text)]) return;
  for(const m of [market, otherMarket(market)]){
    const hit = Object.entries(stockDir[m]).find(([, n]) => n === text || n.toUpperCase() === text.toUpperCase());
    if(hit){ input.value = hit[0]; return; }
  }
}

function fillStockName(input, nameEl, hintEl, market){
  const code = normalizeSymbol(input.value);
  if(!code){ nameEl.value = ''; hintEl.textContent = ''; hintEl.style.color = ''; return; }
  const r = checkStock(market, code);
  nameEl.value = r.name || '';
  hintEl.textContent = r.error || '';
  hintEl.style.color = r.error ? 'var(--loss)' : '';
}

// 下拉建議：代號開頭符合或名稱包含輸入文字，最多 20 筆
function updateSymbolSuggestions(input, listEl, market){
  const q = input.value.trim().toUpperCase();
  if(!q){ listEl.innerHTML = ''; return; }
  const markets = market ? [market] : ['台股', '美股'];
  const hits = [];
  for(const m of markets){
    for(const [code, name] of Object.entries(stockDir[m])){
      if(code.startsWith(q) || name.toUpperCase().includes(q)) hits.push([code, name, m]);
      if(hits.length >= 200) break;
    }
  }
  hits.sort((a, b) => (b[0].startsWith(q) - a[0].startsWith(q)) || a[0].length - b[0].length || (a[0] < b[0] ? -1 : 1));
  listEl.innerHTML = hits.slice(0, 20).map(([code, name, m]) =>
    `<option value="${escapeHtml(code)}">${escapeHtml(name)}${market ? '' : '（' + m + '）'}</option>`).join('');
}

// ── 美元匯率自動更新 ─────────────────────────────────────
// 優先用台灣銀行即期買入匯率（FinMind），失敗改用 open.er-api.com（中價，非買入價）
async function fetchUsdTwd(){
  try{
    const start = new Date(Date.now() - 14 * 86400 * 1000).toISOString().slice(0,10);
    const data = await fetchJson('https://api.finmindtrade.com/api/v4/data?dataset=TaiwanExchangeRate&data_id=USD&start_date=' + start);
    const rows = ((data && data.data) || []).filter(r => r.spot_buy > 0 && r.spot_sell > 0).sort((a, b) => a.date < b.date ? -1 : 1);
    const r = rows[rows.length - 1];
    if(r) return { rate: r.spot_buy, source: '台銀即期買入 ' + r.date };
  }catch(e){}
  const data = await fetchJson('https://open.er-api.com/v6/latest/USD');
  const rate = data && data.rates && data.rates.TWD;
  if(!rate) throw new Error('no rate');
  return { rate, source: 'open.er-api.com 中價，非台銀買入' };
}

async function refreshExchangeRate(){
  const statusEl = document.getElementById('rateStatus');
  try{
    const { rate, source } = await fetchUsdTwd();
    state.exchangeRate = Math.round(rate * 1000) / 1000;
    save();
    loadExchangeRateIntoForm();
    statusEl.textContent = '已自動更新（' + source + '）';
    return true;
  }catch(e){
    statusEl.textContent = '匯率自動更新失敗，沿用 ' + state.exchangeRate;
    return false;
  }
}

let refreshingPrices = false;
let refreshAgain = false;
let retryTimer = null;
async function refreshPrices(){
  if(refreshingPrices){ refreshAgain = true; return; }
  const ratePromise = refreshExchangeRate();
  const statusEl = document.getElementById('priceStatus');
  const btn = document.getElementById('refreshPricesBtn');
  const { holdings } = computeHoldings();
  const markets = {};
  for(const h of holdings) if(h.shares > 0) markets[h.symbol] = h.market || '台股';
  const all = Object.keys(markets);
  if(!all.length){ statusEl.textContent = ''; await ratePromise; renderAll(); return; }

  refreshingPrices = true;
  btn.disabled = true;
  statusEl.textContent = '更新中…';
  const failed = [];
  let waitingForClose = false;
  const setPrice = (sym, price) => { state.prices[sym] = Math.round(price * 100) / 100; };

  const twSyms = all.filter(s => markets[s] !== '美股');
  const usSyms = all.filter(s => markets[s] === '美股');

  let mis = {};
  if(twSyms.length){
    try{ mis = await fetchTwPricesFromMis(twSyms.map(s => s.trim().toUpperCase())); }catch(e){ mis = {}; }
  }
  for(const sym of twSyms){
    const code = sym.trim().toUpperCase();
    let r = mis[code];
    if(!r){ try{ r = await fetchTwPriceFromFinMind(code); }catch(e){ r = null; } }
    if(!r){ failed.push(sym); continue; }
    setPrice(sym, r.price);
    if(!r.isToday) waitingForClose = true;
  }
  for(const sym of usSyms){
    try{
      const price = await fetchUsPrice(sym.trim().toUpperCase());
      if(price != null) setPrice(sym, price); else failed.push(sym);
    }catch(e){ failed.push(sym); }
  }

  await ratePromise;
  save();
  renderAll();
  const t = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
  let msg = `${t} 已更新 ${all.length - failed.length} 檔`;
  if(waitingForClose) msg += '（今日收盤價尚未取得，暫用前一交易日收盤）';
  if(failed.length) msg += `，失敗：${failed.join('、')}（可手動輸入）`;
  statusEl.textContent = msg;
  btn.disabled = false;
  refreshingPrices = false;

  clearTimeout(retryTimer);
  if(waitingForClose && taipeiNow().minutes < 18 * 60) retryTimer = setTimeout(refreshPrices, RETRY_MS);
  if(refreshAgain){ refreshAgain = false; refreshPrices(); }
}
window.refreshPrices = refreshPrices;

// 頁面開著跨過 13:30 時，自動再抓一次當天收盤價
function scheduleCloseRefresh(){
  const target = TW_CUTOFF_MINUTES + 1;
  const mins = target - taipeiNow().minutes;
  if(mins > 0) setTimeout(refreshPrices, mins * 60 * 1000);
}

load();
loadFeeSettingsIntoForm();
loadExchangeRateIntoForm();
renderAll();
refreshPrices();
scheduleCloseRefresh();
loadStockDirectory();
